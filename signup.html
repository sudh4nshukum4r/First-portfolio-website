
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101225">
  <meta name="description" content="Create your LE4RNSP4CE learning account.">
  <title>Create Account | LE4RNSP4CE</title>

  <style>
    * { box-sizing: border-box; }

    :root {
      color-scheme: dark;
      --bg: #101225;
      --card: #17182b;
      --field: #22243b;
      --border: #484a6c;
      --text: #f7f7ff;
      --muted: #b8bad2;
      --accent: #b4a5ff;
      --error: #ffaaaa;
      --success: #9df2bd;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 14px;
      display: grid;
      place-items: center;
      font-family: system-ui, Arial, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at top, #30255c, var(--bg) 60%);
    }

    .card {
      width: min(100%, 540px);
      padding: 28px;
      border: 1px solid #3a3b60;
      border-radius: 22px;
      background: var(--card);
      box-shadow: 0 20px 60px #0005;
    }

    h1 { margin: 0 0 8px; font-size: 28px; }
    .muted { color: var(--muted); line-height: 1.6; }
    .small { font-size: 12px; }

    label {
      display: block;
      margin: 14px 0 6px;
      font-size: 14px;
    }

    input:not([type="checkbox"]), select {
      width: 100%;
      min-height: 46px;
      padding: 11px 12px;
      color: var(--text);
      background: var(--field);
      border: 1px solid var(--border);
      border-radius: 10px;
      font: inherit;
    }

    input:focus, select:focus, button:focus-visible, a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .password-wrap { position: relative; }

    .password-wrap input { padding-right: 84px; }

    .toggle {
      position: absolute;
      right: 7px;
      top: 7px;
      width: auto;
      min-height: 32px;
      margin: 0;
      padding: 5px 8px;
      color: var(--accent);
      background: transparent;
      border: 0;
      font-size: 12px;
    }

    button, .social {
      width: 100%;
      min-height: 46px;
      margin-top: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 11px;
      border: 0;
      border-radius: 10px;
      font: inherit;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }

    .primary {
      color: var(--bg);
      background: var(--accent);
    }

    .social {
      color: white;
      background: #292b45;
      border: 1px solid var(--border);
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .terms {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      line-height: 1.5;
    }

    .terms input {
      flex: 0 0 auto;
      margin-top: 4px;
    }

    .message {
      margin-top: 14px;
      font-size: 14px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .error { color: var(--error); }
    .success { color: var(--success); }
    .info { color: var(--accent); }
    a { color: #c7bdff; }

    @media (max-width: 420px) {
      .card { padding: 20px; }
      .row { grid-template-columns: 1fr; gap: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; }
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>Create your LS4 account</h1>
    <p class="muted">Learn. Build. Share. Grow.</p>

    <form id="signupForm">
      <div class="row">
        <div>
          <label for="firstName">First name *</label>
          <input id="firstName" autocomplete="given-name"
                 required maxlength="60">
        </div>

        <div>
          <label for="lastName">Last name</label>
          <input id="lastName" autocomplete="family-name"
                 maxlength="60">
        </div>
      </div>

      <label for="username">Username *</label>
      <input id="username" autocomplete="username"
             placeholder="e.g. sudhanshu_01"
             minlength="3" maxlength="24"
             pattern="[A-Za-z0-9_]{3,24}"
             autocapitalize="none" spellcheck="false" required>

      <p class="muted small">
        3–24 letters, numbers or underscores. Usernames are stored in lowercase.
      </p>

      <label for="email">Email address *</label>
      <input id="email" type="email" autocomplete="email"
             maxlength="254" required>

      <label for="country">Country *</label>
      <select id="country" required>
        <option value="">Choose your country</option>
        <option value="IN">India</option>
        <option value="US">United States</option>
        <option value="GB">United Kingdom</option>
        <option value="CA">Canada</option>
        <option value="AU">Australia</option>
        <option value="BD">Bangladesh</option>
        <option value="NP">Nepal</option>
        <option value="PK">Pakistan</option>
        <option value="LK">Sri Lanka</option>
        <option value="AE">United Arab Emirates</option>
        <option value="SG">Singapore</option>
        <option value="DE">Germany</option>
        <option value="FR">France</option>
        <option value="JP">Japan</option>
        <option value="BR">Brazil</option>
        <option value="ZA">South Africa</option>
        <option value="OTHER">Other</option>
      </select>

      <label for="language">Preferred language *</label>
      <select id="language" required>
        <option value="en">English</option>
        <option value="hi">हिन्दी (Hindi)</option>
        <option value="bn">বাংলা (Bengali)</option>
        <option value="ur">اردو (Urdu)</option>
        <option value="ne">नेपाली (Nepali)</option>
        <option value="ta">தமிழ் (Tamil)</option>
        <option value="te">తెలుగు (Telugu)</option>
        <option value="mr">मराठी (Marathi)</option>
        <option value="es">Español (Spanish)</option>
        <option value="fr">Français (French)</option>
        <option value="ar">العربية (Arabic)</option>
        <option value="pt">Português (Portuguese)</option>
        <option value="de">Deutsch (German)</option>
        <option value="ja">日本語 (Japanese)</option>
        <option value="zh">中文 (Chinese)</option>
      </select>

      <label for="password">Password *</label>
      <div class="password-wrap">
        <input id="password" type="password"
               autocomplete="new-password" minlength="8"
               maxlength="128" required>
        <button class="toggle" type="button"
                data-toggle="password" aria-pressed="false">
          Show
        </button>
      </div>
      <p class="muted small">
        Use at least 8 characters and a unique password.
      </p>

      <label for="confirmPassword">Confirm password *</label>
      <div class="password-wrap">
        <input id="confirmPassword" type="password"
               autocomplete="new-password" minlength="8"
               maxlength="128" required>
        <button class="toggle" type="button"
                data-toggle="confirmPassword" aria-pressed="false">
          Show
        </button>
      </div>

      <label class="terms">
        <input id="terms" type="checkbox" required>
        <span>
          I agree to the LS4 terms and privacy policy.
          <br>
          <span class="muted small">
            Link your published terms and privacy pages here before launch.
          </span>
        </span>
      </label>

      <button class="primary" id="createBtn" type="submit">
        Create new account
      </button>
    </form>

    <p class="muted" style="text-align:center">Or continue with</p>
    <button class="social" id="googleBtn" type="button">Continue with Google</button>
    <button class="social" id="microsoftBtn" type="button">Continue with Microsoft</button>
    <button class="social" id="githubBtn" type="button">Continue with GitHub</button>
    <button class="social" id="linkedinBtn" type="button">Continue with LinkedIn</button>

    <p id="message" class="message" role="status" aria-live="polite"></p>

    <p class="muted">Already have an account? <a href="login.html">Log in</a></p>
    <p class="muted"><a href="index.html">Back to LS4 home</a></p>
    <p class="muted small">
      Support: <a href="mailto:supportle4nsp4ce@gmail.com">supportle4nsp4ce@gmail.com</a>
    </p>
  </main>

  <script type="module">
    import { initializeApp, getApps } from
      "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";

    import {
      getAuth,
      createUserWithEmailAndPassword,
      updateProfile,
      sendEmailVerification,
      GoogleAuthProvider,
      OAuthProvider,
      GithubAuthProvider,
      signInWithPopup,
      deleteUser
    } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";

    import {
      getFirestore,
      doc,
      getDoc,
      runTransaction,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAq2dZSTyMha1TyifA37ZkUGNB69Bb__mY",
      authDomain: "le4rnsp4ce.firebaseapp.com",
      projectId: "le4rnsp4ce",
      storageBucket: "le4rnsp4ce.firebasestorage.app",
      messagingSenderId: "679714213034",
      appId: "1:679714213034:web:2768833e0c6ce25398d4d3",
      measurementId: "G-9GE67VBYFM"
    };

    const app = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const $ = (id) => document.getElementById(id);
    const form = $("signupForm");
    const createBtn = $("createBtn");
    const message = $("message");

    function showMessage(text, type = "error") {
      message.textContent = text;
      message.className = "message " + type;
    }

    function explainError(error) {
      const code = error?.code || "";

      const messages = {
        "auth/email-already-in-use":
          "This email already has an account. Please log in.",
        "auth/invalid-email":
          "Please enter a valid email address.",
        "auth/weak-password":
          "Choose a stronger password.",
        "auth/popup-closed-by-user":
          "The sign-in window was closed. Try again.",
        "auth/popup-blocked":
          "Your browser blocked the sign-in popup. Allow popups and retry.",
        "auth/operation-not-allowed":
          "This sign-in method is not enabled in Firebase Authentication.",
        "auth/unauthorized-domain":
          "This website domain is not authorized in Firebase.",
        "auth/network-request-failed":
          "Network error. Check your internet and try again.",
        "permission-denied":
          "Firestore permissions blocked this operation. Check the published Firestore Rules.",
        "unavailable":
          "Firebase is temporarily unavailable. Try again shortly."
      };

      return messages[code] ||
        "Something went wrong. Check the error details in your browser console.";
    }

    function getProfileFromForm() {
      const firstName = $("firstName").value.trim();
      const lastName = $("lastName").value.trim();
      const username = $("username").value.trim().toLowerCase();

      if (!firstName) throw new Error("Please enter your first name.");
      if (!/^[a-z0-9_]{3,24}$/.test(username)) {
        throw new Error("Username must be 3–24 letters, numbers or underscores.");
      }
      if (!$("country").value) throw new Error("Please choose your country.");
      if (!$("language").value) throw new Error("Please choose your language.");
      if (!$("terms").checked) throw new Error("Please agree to the terms first.");

      return {
        username,
        displayName: [firstName, lastName].filter(Boolean).join(" "),
        country: $("country").value,
        language: $("language").value
      };
    }

    async function reserveProfile(user, profile) {
      const username = profile.username.trim().toLowerCase();

      if (!/^[a-z0-9_]{3,24}$/.test(username)) {
        throw new Error("INVALID_USERNAME");
      }

      const usernameRef = doc(db, "usernames", username);
      const profileRef = doc(db, "users", user.uid);

      await runTransaction(db, async (transaction) => {
        const existingUsername = await transaction.get(usernameRef);
        const existingProfile = await transaction.get(profileRef);

        if (existingProfile.exists()) {
          throw new Error("PROFILE_ALREADY_EXISTS");
        }

        if (existingUsername.exists()) {
          throw new Error("USERNAME_TAKEN");
        }

        transaction.set(usernameRef, {
          uid: user.uid,
          username,
          createdAt: serverTimestamp()
        });

        transaction.set(profileRef, {
          uid: user.uid,
          username,
          displayName: profile.displayName,
          country: profile.country,
          language: profile.language,
          email: user.email || "",
          photoURL: user.photoURL || "",
          createdAt: serverTimestamp()
        });
      });
    }

    // Password visibility controls
    document.querySelectorAll("[data-toggle]").forEach((button) => {
      button.addEventListener("click", () => {
        const input = $(button.dataset.toggle);
        const show = input.type === "password";

        input.type = show ? "text" : "password";
        button.textContent = show ? "Hide" : "Show";
        button.setAttribute("aria-pressed", String(show));
      });
    });

    // Normalize username as the user leaves the field.
    $("username").addEventListener("blur", () => {
      $("username").value = $("username").value.trim().toLowerCase();
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (!form.reportValidity()) return;

      const password = $("password").value;

      if (password !== $("confirmPassword").value) {
        showMessage("Passwords do not match.");
        $("confirmPassword").focus();
        return;
      }

      let profile;

      try {
        profile = getProfileFromForm();
      } catch (error) {
        showMessage(error.message);
        return;
      }

      createBtn.disabled = true;
      showMessage("Creating your account…", "info");

      let createdUser = null;
      let profileSaved = false;

      try {
        const credential = await createUserWithEmailAndPassword(
          auth,
          $("email").value.trim(),
          password
        );

        createdUser = credential.user;

        await updateProfile(createdUser, {
          displayName: profile.displayName
        });

        await reserveProfile(createdUser, profile);
        profileSaved = true;

        try {
          await sendEmailVerification(createdUser);

          showMessage(
            "Account created! Check your email and verify your address before using features that require verification. Then log in.",
            "success"
          );
        } catch (emailError) {
          console.error("Verification email error:", emailError);

          showMessage(
            "Your account and profile were created, but the verification email could not be sent. Use the login page's verification option if available.",
            "info"
          );
        }
      } catch (error) {
        console.error("Signup error:", error);

        if (error.message === "USERNAME_TAKEN") {
          showMessage("That username is already taken. Choose another.");
        } else if (error.message === "PROFILE_ALREADY_EXISTS") {
          showMessage("A profile already exists for this account. Please log in.");
        } else if (error.message === "INVALID_USERNAME") {
          showMessage("Use a username with 3–24 lowercase letters, numbers or underscores.");
        } else {
          showMessage(explainError(error));
        }

        // If Auth creation succeeded but profile creation failed,
        // try to remove the newly created, incomplete Auth account.
        if (createdUser && !profileSaved) {
          try {
            await deleteUser(createdUser);
          } catch (cleanupError) {
            console.error("Incomplete account cleanup failed:", cleanupError);
            showMessage(
              "Signup did not finish. An authentication account may already exist. Try logging in or use password reset before retrying.",
              "error"
            );
          }
        }
      } finally {
        createBtn.disabled = false;
      }
    });

    async function socialLogin(provider) {
      const buttons = [
        $("googleBtn"), $("microsoftBtn"),
        $("githubBtn"), $("linkedinBtn")
      ];

      buttons.forEach((button) => button.disabled = true);
      showMessage("Opening sign-in…", "info");

      try {
        const result = await signInWithPopup(auth, provider);
        const user = result.user;
        const profileRef = doc(db, "users", user.uid);
        const existingProfile = await getDoc(profileRef);

        if (existingProfile.exists()) {
          showMessage(
            "You are signed in. Continue to the login/dashboard flow configured for your website.",
            "success"
          );
          return;
        }

        // New social account: collect the profile fields from this form.
        let profile;

        try {
          profile = getProfileFromForm();
        } catch (error) {
          showMessage(
            "Social sign-in succeeded, but profile setup is incomplete. Fill in your name, username, country, language and terms, then try again.",
            "info"
          );
          return;
        }

        if (user.displayName && !$("firstName").value.trim()) {
          $("firstName").value = user.displayName;
        }

        await reserveProfile(user, profile);

        showMessage(
          "Your social account and profile were created. Continue through your site's login flow.",
          "success"
        );
      } catch (error) {
        console.error("Social sign-in error:", error);

        if (error.message === "USERNAME_TAKEN") {
          showMessage("That username is already taken. Choose another.");
        } else {
          showMessage(explainError(error));
        }
      } finally {
        buttons.forEach((button) => button.disabled = false);
      }
    }

    $("googleBtn").addEventListener("click", () =>
      socialLogin(new GoogleAuthProvider()));

    $("microsoftBtn").addEventListener("click", () =>
      socialLogin(new OAuthProvider("microsoft.com")));

    $("githubBtn").addEventListener("click", () =>
      socialLogin(new GithubAuthProvider()));

    $("linkedinBtn").addEventListener("click", () => {
      showMessage(
        "LinkedIn sign-in is not connected yet. It requires a supported OAuth/OIDC integration and provider configuration.",
        "info"
      );
    });
  </script>
</body>
</html>
