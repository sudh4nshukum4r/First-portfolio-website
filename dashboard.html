
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090d19">
  <title>Dashboard | LS4 LE4RNSP4CE</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 24px;
      font-family: Arial, sans-serif; color: #f4f6ff;
      background: radial-gradient(ellipse at top left, #242354, transparent 45%), #090d19;
    }
    header, main {
      width: min(100%, 900px); margin: 24px auto;
      padding: 24px; background: #11182a;
      border: 1px solid #29344d; border-radius: 18px;
    }
    header { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
    h1, h2 { margin-top: 0; }
    p { color: #a7b1c8; line-height: 1.7; overflow-wrap: anywhere; }
    button {
      padding: 12px 18px; border: 0; border-radius: 10px;
      background: linear-gradient(100deg, #b4a9ff, #65e6d3);
      color: #090d19; font-weight: bold; cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #status { color: #65e6d3; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>LS4 Dashboard</h1>
      <p id="status" role="status" aria-live="polite">Checking your sign-in...</p>
    </div>
    <button id="logoutButton" type="button" disabled>Sign out</button>
  </header>

  <main>
    <h2>Welcome to your learning space!</h2>
    <p>Signed in account: <strong id="userEmail">Checking...</strong></p>
    <p id="welcomeText">Your LS4 dashboard is loading.</p>
  </main>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";

    import {
      getAuth, setPersistence, browserLocalPersistence,
      onAuthStateChanged, signOut, reload
    } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";

    // Must match the configuration in login.html.
    const firebaseConfig = {
      apiKey: "AIzaSyAq2dZSTyMha1TyifA37ZkUGNB69Bb__mY",
      authDomain: "le4rnsp4ce.firebaseapp.com",
      projectId: "le4rnsp4ce",
      storageBucket: "le4rnsp4ce.firebasestorage.app",
      messagingSenderId: "679714213034",
      appId: "1:679714213034:web:2768833e0c6ce25398d4d3",
      measurementId: "G-9GE67VBYFM"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const status = document.getElementById("status");
    const userEmail = document.getElementById("userEmail");
    const welcomeText = document.getElementById("welcomeText");
    const logoutButton = document.getElementById("logoutButton");

    let checking = false;
    let redirecting = false;

    function goToLogin(message) {
      if (redirecting) return;
      redirecting = true;
      status.textContent = message;
      window.location.replace("./login.html");
    }

    logoutButton.addEventListener("click", async () => {
      logoutButton.disabled = true;
      status.textContent = "Signing out...";
      try {
        await signOut(auth);
        window.location.replace("./login.html");
      } catch (error) {
        status.textContent = "Sign-out failed. Please try again.";
        console.error("Sign-out error:", error);
        logoutButton.disabled = false;
      }
    });

    async function startDashboard() {
      try {
        await setPersistence(auth, browserLocalPersistence);

        onAuthStateChanged(auth, async user => {
          if (checking || redirecting) return;

          if (!user) {
            goToLogin("Please sign in to continue.");
            return;
          }

          checking = true;
          logoutButton.disabled = true;

          try {
            await reload(user);

            if (!user.emailVerified) {
              goToLogin("Please verify your email before continuing.");
              return;
            }

            userEmail.textContent = user.email || "Google account";
            welcomeText.textContent =
              "You are signed in successfully. Your learning journey starts here.";
            status.textContent = "You are logged in.";
            logoutButton.disabled = false;
          } catch (error) {
            console.error("Session check failed:", error);
            status.textContent = "Could not verify your session. Please sign in again.";
            logoutButton.disabled = false;
          } finally {
            checking = false;
          }
        });
      } catch (error) {
        console.error("Firebase initialization error:", error);
        status.textContent =
          "Authentication could not start. Check Firebase configuration and internet.";
      }
    }

    startDashboard();
  </script>
</body>
</html>
