
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090d19">
  <title>Login | LS4 LE4RNSP4CE</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 20px;
      display: grid; place-items: center;
      font-family: Arial, sans-serif; color: #f4f6ff;
      background: radial-gradient(ellipse at top left, #242354, transparent 45%), #090d19;
    }
    .card {
      width: min(100%, 420px); padding: 30px;
      background: #11182a; border: 1px solid #29344d;
      border-radius: 20px;
    }
    h1 { margin-top: 0; }
    p { color: #a7b1c8; line-height: 1.6; }
    label { display: block; margin: 16px 0 8px; }
    input {
      width: 100%; padding: 13px; border-radius: 10px;
      border: 1px solid #29344d; background: #090d19;
      color: white; font-size: 16px;
    }
    button {
      width: 100%; padding: 13px; margin-top: 12px;
      border: 0; border-radius: 10px; cursor: pointer;
      font-size: 15px; font-weight: bold;
    }
    .primary { background: linear-gradient(100deg, #b4a9ff, #65e6d3); color: #090d19; }
    .secondary { background: #202a40; color: white; border: 1px solid #29344d; }
    #message { overflow-wrap: anywhere; font-size: 14px; }
    a { color: #b7afff; }
    .links { margin-top: 20px; text-align: center; line-height: 2; }
    button:disabled { opacity: .6; cursor: wait; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Welcome back 👋</h1>
    <p>Sign in to your LS4 learning space.</p>

    <p id="message" role="status" aria-live="polite"></p>

    <form id="loginForm">
      <label for="email">Email address</label>
      <input id="email" type="email" autocomplete="email"
             placeholder="you@example.com" required>

      <label for="password">Password</label>
      <input id="password" type="password"
             autocomplete="current-password" required>

      <button class="primary" id="loginButton" type="submit">
        Sign in
      </button>
    </form>

    <button class="secondary" id="googleButton" type="button">
      Continue with Google
    </button>

    <button class="secondary" id="verifyButton" type="button" hidden>
      Resend verification email
    </button>

    <button class="secondary" id="checkButton" type="button" hidden>
      I've verified my email — check again
    </button>

    <button class="secondary" id="resetButton" type="button">
      Forgot password?
    </button>

    <div class="links">
      <a href="signup.html">Create an account</a><br>
      <a href="index.html">Back to home</a>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";

    import {
      getAuth, setPersistence, browserLocalPersistence,
      onAuthStateChanged, signInWithEmailAndPassword,
      GoogleAuthProvider, signInWithPopup,
      sendEmailVerification, sendPasswordResetEmail, reload
    } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";

    // Use the same existing Firebase project as dashboard.html.
    const firebaseConfig = {
      apiKey: "AIzaSyAq2dZSTyMha1TyifA37ZkUGNB69Bb__mY",
      authDomain: "le4rnsp4ce.firebaseapp.com",
      projectId: "le4rnsp4ce",
      storageBucket: "le4rnsp4ce.firebasestorage.app",
      messagingSenderId: "679714213034",
      appId: "1:679714213034:web:2768833e0c6ce25398d4d3",
      measurementId: "G-9GE67VBYFM"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const form = document.getElementById("loginForm");
    const email = document.getElementById("email");
    const password = document.getElementById("password");
    const message = document.getElementById("message");
    const loginButton = document.getElementById("loginButton");
    const googleButton = document.getElementById("googleButton");
    const verifyButton = document.getElementById("verifyButton");
    const checkButton = document.getElementById("checkButton");
    const resetButton = document.getElementById("resetButton");

    let busy = false;
    let verificationUser = null;

    function say(text, error = false) {
      message.textContent = text;
      message.style.color = error ? "#ff9292" : "#65e6d3";
    }

    function verificationMode(user) {
      verificationUser = user;
      verifyButton.hidden = false;
      checkButton.hidden = false;
      say("Your email is not verified yet. Check your inbox and spam folder, open the verification link, then return here.");
    }

    function setBusy(value) {
      busy = value;
      loginButton.disabled = value;
      googleButton.disabled = value;
      resetButton.disabled = value;
      verifyButton.disabled = value;
      checkButton.disabled = value;
      loginButton.textContent = value ? "Please wait..." : "Sign in";
    }

    function showError(error) {
      const messages = {
        "auth/invalid-credential": "Email or password is incorrect.",
        "auth/invalid-email": "Please enter a valid email address.",
        "auth/too-many-requests": "Too many attempts. Please wait and try again.",
        "auth/network-request-failed": "Network error. Check your internet.",
        "auth/popup-closed-by-user": "Google sign-in was cancelled.",
        "auth/popup-blocked": "Allow popups in your browser and try again.",
        "auth/unauthorized-domain": "Add sudh4nshukum4r.github.io to Firebase Authorized domains.",
        "auth/operation-not-allowed": "Enable this sign-in method in Firebase Authentication."
      };
      say(messages[error.code] || `Sign-in failed: ${error.code || error.message}`, true);
    }

    async function continueIfVerified(user) {
      await reload(user);
      if (user.emailVerified) {
        window.location.replace("./dashboard.html");
        return true;
      }
      verificationMode(user);
      return false;
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();
      if (busy) return;

      setBusy(true);
      verifyButton.hidden = true;
      checkButton.hidden = true;

      try {
        await setPersistence(auth, browserLocalPersistence);
        const result = await signInWithEmailAndPassword(
          auth, email.value.trim(), password.value
        );

        const verified = await continueIfVerified(result.user);
        if (!verified) {
          try {
            await sendEmailVerification(result.user);
            say("Verification email sent (if available). Check your inbox and spam folder, then click the verification link.");
          } catch (error) {
            say("Your email is still unverified. Open the verification email already sent, or try Resend verification email. " + (error.code || ""), true);
          }
        }
      } catch (error) {
        showError(error);
      } finally {
        setBusy(false);
      }
    });

    googleButton.addEventListener("click", async () => {
      if (busy) return;
      setBusy(true);
      try {
        await setPersistence(auth, browserLocalPersistence);
        await signInWithPopup(auth, new GoogleAuthProvider());
        window.location.replace("./dashboard.html");
      } catch (error) {
        showError(error);
      } finally {
        setBusy(false);
      }
    });

    verifyButton.addEventListener("click", async () => {
      if (busy || !verificationUser) return;
      setBusy(true);
      try {
        await sendEmailVerification(verificationUser);
        say("Verification email sent. Check your inbox and spam folder.");
      } catch (error) {
        showError(error);
      } finally {
        setBusy(false);
      }
    });

    checkButton.addEventListener("click", async () => {
      if (busy || !verificationUser) return;
      setBusy(true);
      try {
        await continueIfVerified(verificationUser);
      } catch (error) {
        showError(error);
      } finally {
        setBusy(false);
      }
    });

    resetButton.addEventListener("click", async () => {
      if (busy) return;
      if (!email.value.trim()) {
        say("Enter your email address first, then click Forgot password.", true);
        email.focus();
        return;
      }
      setBusy(true);
      try {
        await sendPasswordResetEmail(auth, email.value.trim());
        say("If an account exists for this email, a password reset email will arrive. Check spam too.");
      } catch (error) {
        showError(error);
      } finally {
        setBusy(false);
      }
    });

    // Only verified existing sessions go to the dashboard.
    try {
      await setPersistence(auth, browserLocalPersistence);
      onAuthStateChanged(auth, async user => {
        if (!user) return;
        try {
          await reload(user);
          if (user.emailVerified) {
            window.location.replace("./dashboard.html");
          } else {
            verificationMode(user);
          }
        } catch (error) {
          showError(error);
        }
      });
    } catch (error) {
      showError(error);
    }
  </script>
</body>
</html>
