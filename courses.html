
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Courses | LearnSpace</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b12;
      color: #fff;
      padding: 32px 20px;
    }
    main {
      max-width: 800px;
      margin: 50px auto;
    }
    a, button {
      display: inline-block;
      margin: 8px 8px 8px 0;
      padding: 12px 18px;
      border-radius: 8px;
      border: 0;
      background: #ffd84d;
      color: #171717;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
    }
    .card {
      background: #191923;
      border: 1px solid #303040;
      padding: 22px;
      border-radius: 14px;
      margin-top: 20px;
    }
    #status { color: #c9c9d6; }
    html.auth-checking body { visibility: hidden; }
  </style>
  <script>
    document.documentElement.classList.add("auth-checking");
  </script>
</head>
<body>
  <main>
    <h1>LearnSpace Courses</h1>
    <p id="status">Checking your account...</p>
    <div class="card">
      <h2>Welcome, <span id="userName">Learner</span>!</h2>
      <p>Your learning space is ready. Courses will appear here.</p>
      <a href="./index.html">Back to Home</a>
      <button id="logoutButton" type="button">Log out</button>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
    import {
      getAuth,
      onAuthStateChanged,
      signOut
    } from
      "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";

    const firebaseConfig = {
    apiKey: "AIzaSyAq2dZSTyMha1TyifA37ZkUGNB69Bb__mY",
      authDomain: "le4rnsp4ce.firebaseapp.com",
      projectId: "le4rnsp4ce",
      storageBucket: "le4rnsp4ce.firebasestorage.app",
      messagingSenderId: "679714213034",
      appId: "1:679714213034:web:2768833e0c6ce25398d4d3"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const status = document.getElementById("status");

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.replace("./login.html");
        return;
      }

      document.getElementById("userName").textContent =
        user.displayName || user.email || "Learner";
      status.textContent = "You are logged in.";
      document.documentElement.classList.remove("auth-checking");
    });

    document.getElementById("logoutButton").addEventListener("click", async () => {
      await signOut(auth);
      window.location.replace("./login.html");
    });
  </script>
</body>
</html>
