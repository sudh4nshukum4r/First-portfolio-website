
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0b12">
  <meta name="description" content="Your LE4RNSP4CE learning space.">
  <title>Courses | LE4RNSP4CE</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #0b0b12;
      color: #fff;
      padding: 32px 20px;
    }

    main {
      max-width: 800px;
      margin: 50px auto;
    }

    a, button {
      display: inline-block;
      margin: 8px 8px 8px 0;
      padding: 12px 18px;
      border-radius: 8px;
      border: 0;
      background: #ffd84d;
      color: #171717;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
      font-size: 14px;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .card {
      background: #191923;
      border: 1px solid #303040;
      padding: 22px;
      border-radius: 14px;
      margin-top: 20px;
    }

    #status {
      color: #c9c9d6;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    #status.error {
      color: #ffaaaa;
    }

    #status.success {
      color: #9df2bd;
    }

    p {
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    html.auth-checking body {
      visibility: hidden;
    }

    a:focus-visible, button:focus-visible {
      outline: 2px solid #ffd84d;
      outline-offset: 3px;
    }
  </style>

  <script>
    document.documentElement.classList.add("auth-checking");
  </script>
</head>

<body>
  <main>
    <h1>LE4RNSP4CE Courses</h1>

    <p id="status" role="status" aria-live="polite">
      Checking your account...
    </p>

    <div class="card">
      <h2>Welcome, <span id="userName">Learner</span>!</h2>

      <p id="welcomeText">
        Your learning space is loading.
      </p>

      <a href="./index.html">Back to Home</a>

      <button id="logoutButton" type="button" disabled>
        Log out
      </button>
    </div>
  </main>

  <script type="module">
    import { initializeApp, getApps } from
      "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged,
      signOut,
      reload
    } from
      "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAq2dZSTyMha1TyifA37ZkUGNB69Bb__mY",
      authDomain: "le4rnsp4ce.firebaseapp.com",
      projectId: "le4rnsp4ce",
      storageBucket: "le4rnsp4ce.firebasestorage.app",
      messagingSenderId: "679714213034",
      appId: "1:679714213034:web:2768833e0c6ce25398d4d3",
      measurementId: "G-9GE67VBYFM"
    };

    const app = getApps().length
      ? getApps()[0]
      : initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const status = document.getElementById("status");
    const userName = document.getElementById("userName");
    const welcomeText = document.getElementById("welcomeText");
    const logoutButton = document.getElementById("logoutButton");

    let redirecting = false;

    function showStatus(text, type = "") {
      status.textContent = text;
      status.className = type;
    }

    function showPage() {
      document.documentElement.classList.remove("auth-checking");
    }

    function goToLogin(message) {
      if (redirecting) return;

      redirecting = true;
      showStatus(message);
      showPage();

      window.location.replace("./login.html");
    }

    onAuthStateChanged(auth, async (user) => {
      if (redirecting) return;

      if (!user) {
        goToLogin("Please sign in to access your learning space.");
        return;
      }

      logoutButton.disabled = true;
      showStatus("Verifying your account...");

      try {
        await reload(user);

        if (!user.emailVerified) {
          goToLogin(
            "Please verify your email first. Redirecting to login..."
          );
          return;
        }

        userName.textContent =
          user.displayName || user.email || "Learner";

        welcomeText.textContent =
          "You are signed in successfully. Your learning journey starts here.";

        showStatus("Your account is verified. You are logged in.", "success");
        logoutButton.disabled = false;
        showPage();
      } catch (error) {
        console.error("Account verification error:", error);

        showStatus(
          "We could not verify your account. Check your internet connection and try again.",
          "error"
        );

        logoutButton.disabled = false;
        showPage();
      }
    });

    logoutButton.addEventListener("click", async () => {
      logoutButton.disabled = true;
      showStatus("Signing out...");

      try {
        await signOut(auth);
        window.location.replace("./login.html");
      } catch (error) {
        console.error("Sign-out error:", error);

        showStatus(
          "Sign out failed. Please check your connection and try again.",
          "error"
        );

        logoutButton.disabled = false;
      }
    });
  </script>
</body>
</html>
